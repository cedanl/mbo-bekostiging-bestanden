# Datapaden voor de Streamlit-app. Wijzen standaard naar de demo-data.
[data]
raw = "data/01-raw/demo"
prepared = "data/02-prepared/demo"
output = "data/03-output/demo"
# Label in quality.json; zet op "prod" als de paden naar echte data wijzen.
scenario = "demo"

# Pseudonimisering: HMAC-sleutel voor hashing van persoons-identifiers.
# WAARSCHUWING: de sleutel is SECRET en mag NOOIT in version control staan.
# Voor alle omgevingen: zet een sterke, willekeurige sleutel in env var MBO_PSEUDONIMISERING_SALT
# De applicatie faalt als deze sleutel niet is ingesteld (fail-closed).
[security]
# Standaardkeuze op Home: "pseudonimiseren" (vereist een salt) of
# "identifiers_behouden" (BSN/ONR/PGN blijven in de uitvoer; alleen in een
# vertrouwde omgeving). De gebruiker kiest op Home altijd zelf.
persoonsverwerking = "pseudonimiseren"
# De salt staat hier bewust niet: alleen via de env-var MBO_PSEUDONIMISERING_SALT.
