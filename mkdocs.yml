site_name: MBO-bekostigingsbestanden
site_description: Documentatie over de ruwe DUO MBO-bekostigingsbestanden – wat ze bevatten, hoe ze zijn opgebouwd en wat alle velden betekenen.
site_url: https://cedanl.github.io/mbo-bekostiging-bestanden/
repo_url: https://github.com/cedanl/mbo-bekostiging-bestanden
repo_name: cedanl/mbo-bekostiging-bestanden
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: nl
  logo: assets/logos/npuls_logo.jpg
  favicon: assets/logos/beeldmerk.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: >-
  Centrum Educatieve Data Analyse (CEDA) · Onderdeel van <a href="https://npuls.nl/" target="_blank" rel="noopener">Npuls</a> · <a href="https://edu.nl/twt84" target="_blank" rel="noopener">CEDA-community</a> · <a href="mailto:ceda@surf.nl">ceda@surf.nl</a>

plugins:
  - search:
      lang: nl

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - abbr
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - md_in_html

nav:
  - Home: index.md
  - Snel starten:
    - Installeren en draaien: aan-de-slag.md
    - Python-API en kwaliteitsrapport: python-api.md
  - Producten:
    - Brondata per levering: producten/brondata.md
    - Analysemodel (star schema): producten/analysemodel.md
  - Datamodel: datamodel.md
  - Ontwerpkeuzes: ontwerpkeuzes.md
  - Architectuur: architectuur.md
  - Databestanden:
    - databestanden/index.md
    - RO – Registratieoverzicht: databestanden/ro.md
    - TBGI – Bekostigingsgrondslagen XML: databestanden/tbgi.md
    - GRONDSLAG IP MBO: databestanden/grondslag-ip.md
  - Recordtypes:
    - recordtypes/index.md
    - VLP – Voorlooprecord: recordtypes/vlp.md
    - PER – Persoon: recordtypes/per.md
    - ISG – Inschrijving: recordtypes/isg.md
    - ISP – Inschrijvingsperiode: recordtypes/isp.md
    - ISE – Extra ondersteuning: recordtypes/ise.md
    - BPV – Beroepspraktijkvorming: recordtypes/bpv.md
    - DIP – Diploma: recordtypes/dip.md
    - AMO – AMvB-onderdeel: recordtypes/amo.md
    - GEO – Generiek examenonderdeel: recordtypes/geo.md
    - KZD – Keuzedeel: recordtypes/kzd.md
    - BII – Bekostigingsinformatie inschrijving: recordtypes/bii.md
    - BID – Bekostigingsinformatie diploma: recordtypes/bid.md
    - SLR / CTR – Sluit- en controletotalen: recordtypes/slr.md
  - Waardenlijsten: waardenlijsten.md
  - PvE-versies: pve-wijzigingen.md
