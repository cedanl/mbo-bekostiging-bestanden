# Veldschema voor RO (Registratieoverzicht)
# Gebaseerd op het DUO PvE MBO-instelling, §15 (Bijlage 7); versie in pve_bron.json
# (bestandsbeschrijving_beknopt.pdf).
# Veldnamen zijn PascalCase-versies van de officiële Nederlandse namen.
# optionele_achtervelden: de staart van velden die het PvE niet verplicht stelt
# ("Verplicht: Nee"). Alleen die mogen aan het eind van een regel ontbreken; mist
# een verplicht veld, dan faalt de ingest (#281).
# verplicht = true op een recordtype: het bestand moet minstens één regel van dit
# type bevatten (PvE: geen optioneel recordtype); ontbreekt het, dan faalt de
# ingest (#322). Recordtypes zonder vlag (DIP, GEO, ...) mogen ontbreken.

# verplichte_velden: PvE "Verplicht: Ja" per veld (§15.5); een lege waarde is een
# error in quality.json (#416, #419). Recordsoort staat er niet in: die bepaalt
# het recordtype zelf.

[VLP]
verplicht = true
single_row  = true
fields      = ["Recordsoort", "BRIN", "DatumBeginPeriode", "DatumEindePeriode", "DatumAanmaak"]
verplichte_velden = ["BRIN", "DatumBeginPeriode", "DatumEindePeriode", "DatumAanmaak"]
date_fields = ["DatumBeginPeriode", "DatumEindePeriode", "DatumAanmaak"]
int_fields  = []
domeinen = { BRIN = "brin" }

[PER]
verplicht = true
fields      = ["Recordsoort", "Burgerservicenummer", "Onderwijsnummer", "Geboortedatum", "Geslacht"]
verplichte_velden = ["Geboortedatum", "Geslacht"]
date_fields = ["Geboortedatum"]
# PvE §15.5.2: dag of dag+maand mag 00 zijn (onbekend) (#206).
partial_date_fields = ["Geboortedatum"]
int_fields  = []
domeinen = { Geslacht = "geslacht" }

[ISG]
verplicht = true
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "Inschrijvingvolgnummer", "DatumInschrijving", "DatumUitschrijvingGepland",
    "DatumUitschrijvingWerkelijk", "RedenUitschrijving",
]
verplichte_velden = [
    "Inschrijvingvolgnummer", "DatumInschrijving", "DatumUitschrijvingGepland",
]
optionele_achtervelden = ["DatumUitschrijvingWerkelijk", "RedenUitschrijving"]
date_fields = ["DatumInschrijving", "DatumUitschrijvingGepland", "DatumUitschrijvingWerkelijk"]
int_fields  = []
domeinen = { RedenUitschrijving = "reden_uitschrijving" }

[ISP]
verplicht = true
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "Inschrijvingvolgnummer", "DatumBegin", "Opleidingcode",
    "Leertraject", "Niveau", "IndicatieBekostigbaar",
    "LocatiecodeVSV", "Onderwijsaanbieder", "Onderwijslocatie",
    "Leerroute", "Leerroutefase",
]
verplichte_velden = [
    "Inschrijvingvolgnummer", "DatumBegin", "Opleidingcode", "Leertraject",
    "IndicatieBekostigbaar",
]
optionele_achtervelden = [
    "LocatiecodeVSV", "Onderwijsaanbieder", "Onderwijslocatie", "Leerroute",
    "Leerroutefase",
]
date_fields = ["DatumBegin"]
int_fields  = []
domeinen = { IndicatieBekostigbaar = "indicatie_bekostigbaar", Onderwijsaanbieder = "onderwijsaanbieder", Opleidingcode = "opleidingcode", Niveau = "niveau", Leertraject = "leertraject", Onderwijslocatie = "onderwijslocatie", Leerroute = "leerroute", Leerroutefase = "leerroutefase", LocatiecodeVSV = "locatiecode_vsv" }
# Datum voor de geldigheid van tijdgebonden waarden (#325).
peildatum = "DatumBegin"

[ISE]
fields      = ["Recordsoort", "Burgerservicenummer", "Onderwijsnummer", "Inschrijvingvolgnummer", "DatumBegin", "DatumEind"]
verplichte_velden = ["Inschrijvingvolgnummer", "DatumBegin"]
optionele_achtervelden = ["DatumEind"]
date_fields = ["DatumBegin", "DatumEind"]
int_fields  = []

[BPV]
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "Inschrijvingvolgnummer", "Volgnummer", "Afsluitdatum",
    "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk",
    "Omvang", "LeerbedrijfID", "Opleidingcode", "CodeKeuzedeel",
]
verplichte_velden = [
    "Inschrijvingvolgnummer", "Volgnummer", "Afsluitdatum", "DatumBegin",
    "DatumEindGepland", "LeerbedrijfID",
]
optionele_achtervelden = ["Opleidingcode", "CodeKeuzedeel"]
date_fields = ["Afsluitdatum", "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk"]
int_fields  = ["Omvang"]
domeinen = { Omvang = "omvang_bpv_ro", LeerbedrijfID = "leerbedrijf_id", Opleidingcode = "opleidingcode" }

[DIP]
# Praktijk: positie 7 staat niet in het PvE maar wel in alle bekende leveringen
# (altijd leeg). Layoutkeuze: zie grondslag_schema.toml (#321).
layout = "praktijk"
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "Resultaatvolgnummer", "Opleidingcode", "DatumResultaat",
    "_onbekend", "IndicatieBekostigbaar", "Inschrijvingvolgnummer",
    "Onderwijsaanbieder",
]
verplichte_velden = [
    "Resultaatvolgnummer", "Opleidingcode", "DatumResultaat",
    "IndicatieBekostigbaar",
]
optionele_achtervelden = ["Inschrijvingvolgnummer", "Onderwijsaanbieder"]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { _onbekend = "leeg", IndicatieBekostigbaar = "indicatie_bekostigbaar", Onderwijsaanbieder = "onderwijsaanbieder", Opleidingcode = "opleidingcode" }
herkenning = ["_onbekend", "IndicatieBekostigbaar"]

# PvE §15.5.7: negen velden, Indicatie bekostigbaar direct na Datum resultaat.
[DIP.varianten.officieel]
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "Resultaatvolgnummer", "Opleidingcode", "DatumResultaat",
    "IndicatieBekostigbaar", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]

[AMO]
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "ResultaatvolgnummerDiploma", "OpleidingcodeDiploma",
    "Resultaatvolgnummer", "CodeAMvBOnderdeel", "DatumResultaat",
    "Certificaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
verplichte_velden = ["Resultaatvolgnummer", "CodeAMvBOnderdeel"]
optionele_achtervelden = [
    "DatumResultaat", "Certificaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { Certificaat = "certificaat", OpleidingcodeDiploma = "opleidingcode", Onderwijsaanbieder = "onderwijsaanbieder" }

[GEO]
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "ResultaatvolgnummerDiploma", "OpleidingcodeDiploma",
    "Resultaatvolgnummer", "CodeGeneriekExamenonderdeel", "DatumResultaat",
    "Eindcijfer", "VrijstellingGeneriekExamenonderdeel",
    "CijferIE", "VrijstellingIE", "CijferCE", "VrijstellingCE",
    "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
verplichte_velden = ["Resultaatvolgnummer", "CodeGeneriekExamenonderdeel"]
optionele_achtervelden = [
    "DatumResultaat", "Eindcijfer", "VrijstellingGeneriekExamenonderdeel",
    "CijferIE", "VrijstellingIE", "CijferCE", "VrijstellingCE",
    "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
# Komma-cijfers zijn geldig volgens het PvE (bv. "6,5"); float, geen int (#207, #259).
float_fields = ["Eindcijfer", "CijferIE", "CijferCE"]
domeinen = { OpleidingcodeDiploma = "opleidingcode", Onderwijsaanbieder = "onderwijsaanbieder" }

[KZD]
fields = [
    "Recordsoort", "Burgerservicenummer", "Onderwijsnummer",
    "ResultaatvolgnummerDiploma", "OpleidingcodeDiploma",
    "Resultaatvolgnummer", "CodeKeuzedeel", "DatumResultaat",
    "Resultaat", "Certificaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
verplichte_velden = ["Resultaatvolgnummer", "CodeKeuzedeel", "Resultaat"]
optionele_achtervelden = ["Certificaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder"]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { Resultaat = "kzd_resultaat", Certificaat = "certificaat", OpleidingcodeDiploma = "opleidingcode", Onderwijsaanbieder = "onderwijsaanbieder" }

[SLR]
verplicht = true
single_row  = true
fields = [
    "Recordsoort", "AantalPER", "AantalISG", "AantalISP",
    "AantalISE", "AantalBPV", "AantalDIP", "AantalAMO",
    "AantalGEO", "AantalKZD",
]
verplichte_velden = [
    "AantalPER", "AantalISG", "AantalISP", "AantalISE", "AantalBPV", "AantalDIP",
    "AantalAMO", "AantalGEO", "AantalKZD",
]
date_fields = []
int_fields  = ["AantalPER", "AantalISG", "AantalISP", "AantalISE", "AantalBPV", "AantalDIP", "AantalAMO", "AantalGEO", "AantalKZD"]
