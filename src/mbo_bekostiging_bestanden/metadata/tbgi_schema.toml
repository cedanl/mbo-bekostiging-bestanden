# Veldschema voor TBGI (Terugmelding BekostigingsGrondslagen individueel)
# Gebaseerd op het DUO PvE MBO-instelling, §16 (Bijlage 8: Bestandsbeschrijving TBG-i);
# versie in pve_bron.json
# (bestandsbeschrijving_beknopt.pdf).
# XML-structuur wordt door read_tbgi platgeslagen naar vijf tabellen: Inschrijving,
# Teldatum, BekostigingsrelevanteBPV, Diploma en Signaal (één rij per parameter).
# domeinen: waardedomein per veld uit waardenlijsten.toml (PvE §16.6), zoals bij
# RO en GRONDSLAG (#205, #323). Velden zonder domein: vrije tekst, datum, getal of
# of een volgnummer; per veld staat de reden in ``[geen_domein]`` van
# waardenlijsten.toml (#356).

# verplichte_velden: PvE "Verplicht: Ja" per veld (§16.5); een lege waarde is
# een error in quality.json (#416, #419). Velden die de ingest uit een
# bovenliggend XML-element overneemt (BSN, Inschrijvingvolgnummer, ...) staan
# niet in de PvE-tabel van het kind en dus niet in de lijst.

[Inschrijving]
fields = [
    "BRIN", "Burgerservicenummer", "Onderwijsnummer",
    "Inschrijvingvolgnummer",
    "DatumInschrijving", "DatumUitschrijvingGepland", "DatumUitschrijvingWerkelijk",
    "NiveauHoogstBekostigdeDiploma",
]
verplichte_velden = [
    "BRIN", "Inschrijvingvolgnummer", "DatumInschrijving",
    "DatumUitschrijvingGepland",
]
date_fields  = ["DatumInschrijving", "DatumUitschrijvingGepland", "DatumUitschrijvingWerkelijk"]
int_fields   = []
float_fields = []
domeinen = { BRIN = "brin", NiveauHoogstBekostigdeDiploma = "niveau" }

[Teldatum]
# DatumTijdBepalingBekostigingsgrondslagen is een datetime en blijft Utf8.
# BRIN t/m Inschrijvingvolgnummer komen van de ouder-Inschrijving: het volgnummer
# is alleen uniek per persoon, dus de persoon moet op de rij zelf staan (#125).
fields = [
    "BRIN", "Burgerservicenummer", "Onderwijsnummer", "Inschrijvingvolgnummer",
    "Teldatum",
    "DatumTijdBepalingBekostigingsgrondslagen", "StatusBepalingBekostigingsstatus",
    "LeeftijdOpEenAugustusStudiejaar", "Opleidingcode", "Niveau", "Leertraject",
    "Leerroutefase", "IndicatieBekostigbaar", "Bekostigingsstatus",
    "InschrijvingVoorCorrectiefactor",
    "BBLBOLFactor", "PrijsfactorMBO",
    "AantalBekostigdeVerblijfsjarenMBO", "Verblijfsjaarfactor",
    "BijdrageInschrijvingAanDeelnemerswaarde",
]
# BRIN staat niet in de PvE-tabel van dit recordtype maar is structureel: leeg
# wijst op een verschoven of afgeknipte regel (#320).
verplichte_velden = [
    "BRIN", "Teldatum", "DatumTijdBepalingBekostigingsgrondslagen",
    "StatusBepalingBekostigingsstatus", "LeeftijdOpEenAugustusStudiejaar",
    "Opleidingcode", "Niveau", "Leertraject", "IndicatieBekostigbaar",
    "InschrijvingVoorCorrectiefactor",
]
date_fields  = ["Teldatum"]
int_fields   = ["LeeftijdOpEenAugustusStudiejaar", "AantalBekostigdeVerblijfsjarenMBO"]
float_fields = ["BBLBOLFactor", "PrijsfactorMBO", "Verblijfsjaarfactor", "BijdrageInschrijvingAanDeelnemerswaarde"]
domeinen = { BRIN = "brin", Opleidingcode = "opleidingcode", Niveau = "niveau", Leertraject = "leertraject", Leerroutefase = "leerroutefase", IndicatieBekostigbaar = "indicatie_bekostigbaar", InschrijvingVoorCorrectiefactor = "boolean", Bekostigingsstatus = "boolean", StatusBepalingBekostigingsstatus = "status_bepaling_bekostigingsstatus" }
# Datum voor de geldigheid van tijdgebonden waarden (#325).
peildatum = "Teldatum"

[BekostigingsrelevanteBPV]
# 0..n per teldatum (PvE §16.1: "Alle BPV's ... die voldoen aan de eisen"), #126.
# BRIN t/m Teldatum komen van de ouder; InschrijvingvolgnummerBPV is de eigen
# <Inschrijvingvolgnummer> van de BPV (de inschrijving waarbij hij geregistreerd is).
fields = [
    "BRIN", "Burgerservicenummer", "Onderwijsnummer", "Inschrijvingvolgnummer",
    "Teldatum",
    "InschrijvingvolgnummerBPV", "Volgnummer", "Afsluitdatum",
    "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk", "Opleidingcode",
]
# BRIN staat niet in de PvE-tabel van dit recordtype maar is structureel: leeg
# wijst op een verschoven of afgeknipte regel (#320).
verplichte_velden = [
    "BRIN", "InschrijvingvolgnummerBPV", "Volgnummer", "Afsluitdatum", "DatumBegin",
    "DatumEindGepland", "Opleidingcode",
]
date_fields  = ["Teldatum", "Afsluitdatum", "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk"]
int_fields   = []
float_fields = []
domeinen = { BRIN = "brin", Opleidingcode = "opleidingcode" }

[Diploma]
# DatumTijdBepalingBekostigingsgrondslagen is een datetime en blijft Utf8.
fields = [
    "BRIN", "Burgerservicenummer", "Onderwijsnummer",
    "Resultaatvolgnummer", "Opleidingcode", "Inschrijvingvolgnummer",
    "DatumBehaald", "Niveau",
    "IndicatieSpecialistendiploma", "NiveauHoogstBekostigdeDiploma",
    "IndicatieHoogstBekostigdeDiplomaIsSpecialist",
    "DatumTijdBepalingBekostigingsgrondslagen", "StatusBepalingBekostigingsstatus",
    "Bekostigingsstatus", "BijdrageDiplomawaarde",
]
# NiveauHoogstBekostigdeDiploma en IndicatieHoogstBekostigdeDiplomaIsSpecialist
# zijn volgens het PvE verplicht, maar zonder eerder bekostigd diploma is er geen
# waarde; leveringen laten ze dan leeg (demo). Bij Inschrijving zijn ze optioneel.
verplichte_velden = [
    "BRIN", "Resultaatvolgnummer", "Opleidingcode", "Inschrijvingvolgnummer",
    "DatumBehaald", "Niveau", "IndicatieSpecialistendiploma",
    "DatumTijdBepalingBekostigingsgrondslagen", "StatusBepalingBekostigingsstatus",
    "Bekostigingsstatus",
]
date_fields  = ["DatumBehaald"]
int_fields   = []
float_fields = ["BijdrageDiplomawaarde"]
domeinen = { BRIN = "brin", Opleidingcode = "opleidingcode", Niveau = "niveau", NiveauHoogstBekostigdeDiploma = "niveau", IndicatieSpecialistendiploma = "boolean", IndicatieHoogstBekostigdeDiplomaIsSpecialist = "boolean", Bekostigingsstatus = "boolean", StatusBepalingBekostigingsstatus = "status_bepaling_bekostigingsstatus" }

[Signaal]
# Bron = "Inschrijving" of "Diploma".
# Teldatum en Resultaatvolgnummer zijn null voor respectievelijk Diploma en Inschrijving.
# Persoons-identifiers komen van de ouder (Inschrijving of Diploma), zie #125.
# Eén rij per parameter; Signaal- en Parametervolgnummer zijn AN1..2 (#126).
fields = [
    "Bron", "BRIN", "Burgerservicenummer", "Onderwijsnummer", "Inschrijvingvolgnummer", "Teldatum", "Resultaatvolgnummer",
    "Signaalvolgnummer", "Signaalcode", "Signaalomschrijving",
    "Parametervolgnummer", "Parameternaam", "Parameterwaarde",
]
# BRIN staat niet in de PvE-tabel van dit recordtype maar is structureel: leeg
# wijst op een verschoven of afgeknipte regel (#320).
verplichte_velden = ["BRIN", "Signaalvolgnummer", "Signaalcode", "Signaalomschrijving"]
date_fields  = []
int_fields   = []
float_fields = []
domeinen = { BRIN = "brin" }
