# Veldschema voor GRONDSLAG IP MBO (afslag register-levering IP)
# Gebaseerd op het DUO PvE MBO-instelling, §17.5; versie in pve_bron.json
# (bestandsbeschrijving_beknopt.pdf). Positioneel getoetst in tests/test_grondslag_pve.py.
# Veldnamen zijn PascalCase-versies van de officiële Nederlandse namen.
# optionele_achtervelden: de staart van velden die het PvE niet verplicht stelt
# ("Verplicht: Nee"). Alleen die mogen aan het eind van een regel ontbreken; mist
# een verplicht veld, dan faalt de ingest (#281).
# verplicht = true op een recordtype: het bestand moet minstens één regel van dit
# type bevatten (PvE: geen optioneel recordtype); ontbreekt het, dan faalt de
# ingest (#322). Recordtypes zonder vlag (DIP, GEO, ...) mogen ontbreken.
# layout + varianten (#236, #321): recordtypes met meer dan één bewezen
# veldvolgorde. `fields` is de standaardlayout (`layout` = zijn naam) en tegelijk
# de kolomset van de uitvoer; een variant noemt alleen zijn eigen volgorde. De
# ingest kiest per regel de layout waarop lengte en `herkenning` (velden met een
# domein uit `domeinen`) passen; geen of meer dan één passende layout, of
# gemengde layouts in één bestand, is een error. Kolommen die een variant mist
# blijven leeg, behalve `uit_bestandsnaam` (named group in `bestandsnaam`).
# PvE §17.3: GRONDSLAG_IP_MBO_<BRIN>_<einddatum selectie>_<studiejaar>.csv
bestandsnaam = '(?i)^GRONDSLAG_IP_MBO_(?P<BRIN>[^_]+)_'

[VLP]
verplicht = true
single_row  = true
# Praktijk: echte leveringen hebben BRIN op positie 2 (zie demo-levering).
layout      = "praktijk"
fields      = ["Recordsoort", "BRIN", "Studiejaar", "DatumAanmaak", "BekostigingsType"]
date_fields = ["DatumAanmaak"]
int_fields  = ["Studiejaar"]
domeinen = { BRIN = "brin", Studiejaar = "studiejaar", BekostigingsType = "bekostigingstype" }
herkenning = ["Studiejaar", "BekostigingsType"]

# PvE §17.5: geen BRIN in het voorlooprecord; die staat in de bestandsnaam.
[VLP.varianten.officieel]
fields = ["Recordsoort", "Studiejaar", "DatumAanmaak", "BekostigingsType"]
uit_bestandsnaam = ["BRIN"]

[PER]
verplicht = true
# Posities 19-21 staan niet in de PvE-spec maar wel in echte leveringen: meestal
# gelijk aan Postcodecijfers/Verblijfstitel/Nationaliteit1, niet altijd. Hun
# betekenis is onbekend; ze worden bewaard als <veld>_positie<n> (alleen in de
# brondata, #260) en verschillen staan in quality.json → regelinventaris (#120).
spiegelvelden = ["Postcodecijfers", "Verblijfstitel", "Nationaliteit1"]
fields = [
    "Recordsoort", "PseudoNummer",
    "Leeftijd1", "Leeftijd2", "Leeftijd3", "Leeftijd4",
    "Geslacht", "Postcodecijfers",
    "DatumOverlijden", "DatumVestigingNederland", "DatumVertrekNederland",
    "CodeGeboorteland", "CodeGeboortelandOuder1", "CodeGeboortelandOuder2",
    "CodeLandWaarnaarVertrokken", "Verblijfstitel",
    "Nationaliteit1", "Nationaliteit2",
]
optionele_achtervelden = [
    "DatumOverlijden", "DatumVestigingNederland", "DatumVertrekNederland",
    "CodeGeboorteland", "CodeGeboortelandOuder1", "CodeGeboortelandOuder2",
    "CodeLandWaarnaarVertrokken", "Verblijfstitel", "Nationaliteit1",
    "Nationaliteit2",
]
date_fields = ["DatumOverlijden", "DatumVestigingNederland", "DatumVertrekNederland"]
int_fields  = ["Leeftijd1", "Leeftijd2", "Leeftijd3", "Leeftijd4"]
domeinen = { Geslacht = "geslacht", Postcodecijfers = "postcodecijfers" }

[ISG]
verplicht = true
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Inschrijvingvolgnummer", "DatumInschrijving",
    "DatumUitschrijvingGepland", "DatumUitschrijvingWerkelijk", "RedenUitschrijving",
]
optionele_achtervelden = ["DatumUitschrijvingWerkelijk", "RedenUitschrijving"]
date_fields = ["DatumInschrijving", "DatumUitschrijvingGepland", "DatumUitschrijvingWerkelijk"]
int_fields  = []
domeinen = { BRIN = "brin", RedenUitschrijving = "reden_uitschrijving" }

[ISP]
verplicht = true
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Inschrijvingvolgnummer", "DatumBegin", "DatumEind",
    "Opleidingcode", "Niveau", "Leertraject", "LocatiecodeVSV",
    "IndicatieBekostigbaar", "Onderwijsaanbieder", "Onderwijslocatie",
    "Leerroute", "Leerroutefase",
]
optionele_achtervelden = [
    "Onderwijsaanbieder", "Onderwijslocatie", "Leerroute", "Leerroutefase",
]
date_fields = ["DatumBegin", "DatumEind"]
int_fields  = []
domeinen = { BRIN = "brin", IndicatieBekostigbaar = "indicatie_bekostigbaar", Onderwijsaanbieder = "onderwijsaanbieder", Opleidingcode = "opleidingcode", Niveau = "niveau", Leertraject = "leertraject", Onderwijslocatie = "onderwijslocatie", Leerroute = "leerroute", Leerroutefase = "leerroutefase", LocatiecodeVSV = "locatiecode_vsv" }
# Datum voor de geldigheid van tijdgebonden waarden (#325).
peildatum = "DatumBegin"

[ISE]
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Inschrijvingvolgnummer", "DatumBeginExtraOndersteuning", "DatumEindExtraOndersteuning",
]
optionele_achtervelden = ["DatumEindExtraOndersteuning"]
date_fields = ["DatumBeginExtraOndersteuning", "DatumEindExtraOndersteuning"]
int_fields  = []
domeinen = { BRIN = "brin" }

[BPV]
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Inschrijvingvolgnummer", "Volgnummer",
    "Afsluitdatum", "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk",
    "Omvang", "LeerbedrijfID", "Opleidingcode", "CodeKeuzedeel",
]
optionele_achtervelden = ["Opleidingcode", "CodeKeuzedeel"]
date_fields = ["Afsluitdatum", "DatumBegin", "DatumEindGepland", "DatumEindWerkelijk"]
int_fields  = ["Omvang"]
domeinen = { BRIN = "brin", Omvang = "omvang_bpv_grondslag", LeerbedrijfID = "leerbedrijf_id", Opleidingcode = "opleidingcode" }

[BII]
# Niet aanwezig in demo-data; aangemaakt na bekostigingsberekening door DUO.
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Inschrijvingvolgnummer", "Teldatum",
    "DatumTijdBepalingBekostigingsgrondslagen", "StatusBepalingBekostigingsstatus",
    "Bekostigingsstatus", "InschrijvingVoorCorrectiefactor",
    "BBLBOLFactor", "PrijsfactorMBO",
    "AantalBekostigdeVerblijfsjarenMBO", "Verblijfsjaarfactor",
    "BijdrageInschrijvingAanDeelnemerswaarde",
]
# Namen en typering gelijk aan TBG-i (tbgi_schema.toml [Teldatum]), zoals het
# PvE ze in §16 en §17 noemt: één concept, één kolom in fact_bekostiging (#208).
optionele_achtervelden = [
    "BBLBOLFactor", "PrijsfactorMBO", "AantalBekostigdeVerblijfsjarenMBO",
    "Verblijfsjaarfactor", "BijdrageInschrijvingAanDeelnemerswaarde",
]
date_fields  = ["Teldatum"]
int_fields   = ["AantalBekostigdeVerblijfsjarenMBO"]
float_fields = ["BBLBOLFactor", "PrijsfactorMBO", "Verblijfsjaarfactor", "BijdrageInschrijvingAanDeelnemerswaarde"]
domeinen = { BRIN = "brin", StatusBepalingBekostigingsstatus = "status_bepaling_bekostigingsstatus", Bekostigingsstatus = "ja_nee", InschrijvingVoorCorrectiefactor = "ja_nee" }

[DIP]
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Resultaatvolgnummer", "Opleidingcode", "DatumResultaat",
    "IndicatieBekostigbaar", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
optionele_achtervelden = [
    "IndicatieBekostigbaar", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { BRIN = "brin", IndicatieBekostigbaar = "indicatie_bekostigbaar", Onderwijsaanbieder = "onderwijsaanbieder", Opleidingcode = "opleidingcode" }

[BID]
# Niet aanwezig in demo-data; aangemaakt na bekostigingsberekening door DUO.
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "Resultaatvolgnummer", "Niveau", "IndicatieSpecialistendiploma",
    "NiveauHoogstBekostigdeDiploma", "IndicatieHoogstBekostigdeDiplomaIsSpecialist",
    "DatumTijdBepalingBekostigingsgrondslagen", "StatusBepalingBekostigingsstatus",
    "Bekostigingsstatus", "BijdrageDiplomawaarde",
]
optionele_achtervelden = ["Bekostigingsstatus", "BijdrageDiplomawaarde"]
date_fields  = []
int_fields   = []
float_fields = ["BijdrageDiplomawaarde"]
domeinen = { BRIN = "brin", Niveau = "niveau", IndicatieSpecialistendiploma = "ja_nee", NiveauHoogstBekostigdeDiploma = "niveau", IndicatieHoogstBekostigdeDiplomaIsSpecialist = "ja_nee", StatusBepalingBekostigingsstatus = "status_bepaling_bekostigingsstatus", Bekostigingsstatus = "ja_nee" }

[AMO]
# Niet aanwezig in demo-data (subset); aanwezig in volledig bestand.
# Anders dan RO (§15) géén OpleidingcodeDiploma, en Certificaat vóór DatumResultaat (#127).
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "ResultaatvolgnummerDiploma", "Resultaatvolgnummer", "CodeAMvBOnderdeel",
    "Certificaat", "DatumResultaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
optionele_achtervelden = [
    "Certificaat", "DatumResultaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { BRIN = "brin", Certificaat = "certificaat", Onderwijsaanbieder = "onderwijsaanbieder" }

[GEO]
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "ResultaatvolgnummerDiploma", "Resultaatvolgnummer",
    "CodeGeneriekExamenonderdeel", "Eindcijfer",
    "VrijstellingGeneriekExamenonderdeel",
    "CijferIE", "VrijstellingIE", "CijferCE", "VrijstellingCE",
    "DatumResultaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
optionele_achtervelden = [
    "Eindcijfer", "VrijstellingGeneriekExamenonderdeel", "CijferIE",
    "VrijstellingIE", "CijferCE", "VrijstellingCE", "DatumResultaat",
    "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
# Komma-cijfers zijn geldig volgens het PvE (bv. "6,5"); float, geen int (#208, #259).
float_fields = ["Eindcijfer", "CijferIE", "CijferCE"]
domeinen = { BRIN = "brin", Onderwijsaanbieder = "onderwijsaanbieder" }

[KZD]
# Certificaat vóór DatumResultaat, anders dan RO (§15) (#127).
fields = [
    "Recordsoort", "PseudoNummer", "BRIN",
    "ResultaatvolgnummerDiploma", "Resultaatvolgnummer",
    "CodeKeuzedeel", "Resultaat", "Certificaat",
    "DatumResultaat", "Inschrijvingvolgnummer", "Onderwijsaanbieder",
]
optionele_achtervelden = [
    "Resultaat", "Certificaat", "DatumResultaat", "Inschrijvingvolgnummer",
    "Onderwijsaanbieder",
]
date_fields = ["DatumResultaat"]
int_fields  = []
domeinen = { BRIN = "brin", Resultaat = "kzd_resultaat", Certificaat = "certificaat", Onderwijsaanbieder = "onderwijsaanbieder" }

[SLR]
verplicht = true
single_row = true
fields = [
    "Recordsoort",
    "AantalPER", "AantalISG", "AantalISP", "AantalISE",
    "AantalBPV", "AantalBII", "AantalDIP", "AantalBID",
    "AantalAMO", "AantalGEO", "AantalKZD",
]
date_fields = []
int_fields  = [
    "AantalPER", "AantalISG", "AantalISP", "AantalISE",
    "AantalBPV", "AantalBII", "AantalDIP", "AantalBID",
    "AantalAMO", "AantalGEO", "AantalKZD",
]
