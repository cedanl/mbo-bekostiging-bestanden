# Gecodeerde veldwaarden uit het DUO PvE MBO-instelling (versie in pve_bron.json)
# en de waardedomeinen
# per veld. Waarden staan in genormaliseerde vorm: hoofdletters, enkele spaties.
# RO (§15.5.10) schrijft "Behaald"/"Niet behaald", GRONDSLAG (§17.5) "BEHAALD"/"NIET BEHAALD".

[kzd_resultaat]
behaald = ["BEHAALD"]
niet_behaald = ["NIET BEHAALD"]

# RO "J"/"N", GRONDSLAG "1"/"0", TBG-i "true"/"false"; genormaliseerd naar J/N.
[indicatie_bekostigbaar]
ja = ["J", "1", "TRUE"]
nee = ["N", "0", "FALSE"]

# Waardedomeinen (#205): in het schema per veld gekoppeld via `domeinen`. Een
# waarde buiten het domein verraadt vaak een verschoven veldindeling.
# Soorten: patroon (regex op de getrimde waarde), waarden (genormaliseerd),
# waardenlijst (alle waarden van een lijst hierboven), leeg (veld hoort leeg).
# Ernst (#238): "error" voor velden waar een afwijking op een verschoven
# recordlayout wijst (BRIN, Studiejaar) — anders "warning" (default).
# Verplicht (#320): het PvE schrijft het veld voor, dus een lege waarde telt als
# afwijking; zonder deze vlag tellen lege waarden niet (optioneel veld).
[domein.brin]
patroon = '^[0-9]{2}[A-Z]{2}$'
ernst = "error"
verplicht = true

[domein.studiejaar]
patroon = '^[0-9]{4}$'
ernst = "error"
verplicht = true

[domein.onderwijsaanbieder]
patroon = '^[0-9]{3}A[0-9]{3}$'

[domein.opleidingcode]
patroon = '^[0-9]{5}$'

[domein.niveau]
waarden = ["MBO-1", "MBO-2", "MBO-3", "MBO-4"]

[domein.leertraject]
waarden = ["BOL", "BOL_DT", "BBL", "OVO", "EX", "ODT"]
ernst = "error"
verplicht = true
# Bijlage 3 van de toelichting onderwijsresultaten: alleen bol, bol-dt, bbl en
# ex tellen mee in de indicatorpopulatie (JR/DR). OVO en ODT niet (#286).
buiten_indicatorpopulatie = ["OVO", "ODT"]
# PvE §16.6: geldigheid per waarde, inclusief; getoetst op de `peildatum` van het
# recordtype in het schema (#325). Alleen periodes die het PvE noemt.
[domein.leertraject.geldigheid]
BOL = { vanaf = 1997-08-01 }
BOL_DT = { vanaf = 1997-08-01, tot = 2023-07-31 }
BBL = { vanaf = 1997-08-01 }
OVO = { vanaf = 1997-08-01 }
EX = { vanaf = 1997-08-01 }
ODT = { vanaf = 2019-01-01 }

# PvE §16.6: alleen "D" (definitief) en "V" (voorlopig).
[domein.status_bepaling_bekostigingsstatus]
waarden = ["D", "V"]

# PvE §17.5 VLP: voorlopige (V) of definitieve (D) bekostiging.
[domein.bekostigingstype]
waarden = ["V", "D"]
ernst = "error"
verplicht = true

# PvE §16.6: voortgezet onderwijs of mbo.
[domein.leerroutefase]
waarden = ["VO", "MBO"]

[domein.leerroutefase.geldigheid]
VO = { vanaf = 2020-08-01 }
MBO = { vanaf = 2020-08-01 }

[domein.certificaat]
waarden = ["J", "N", "1", "0"]

[domein.boolean]
waarden = ["TRUE", "FALSE"]
ernst = "error"
verplicht = true

[domein.boolean_optioneel]
waarden = ["TRUE", "FALSE"]
ernst = "error"

[domein.indicatie_bekostigbaar]
waardenlijst = "indicatie_bekostigbaar"
ernst = "error"
verplicht = true

[domein.kzd_resultaat]
waardenlijst = "kzd_resultaat"

# Een gevulde waarde kan hier alleen door een verschoven layout komen (#287).
[domein.leeg]
leeg = true
ernst = "error"

# PvE §15.5.2 (RO-PER): M, V, O (vastgesteld onbekend). Ook GRONDSLAG-PER.
[domein.geslacht]
waarden = ["M", "V", "O"]
verplicht = true

[domein.ja_nee]
waarden = ["J", "N"]

# Formaatdomeinen (#288): het PvE geeft het formaat, maar de waardenlijst staat
# niet in de beknopte PDF. Het patroon vangt verschoven waarden (een datum, een
# code van een ander veld), niet een onbekende code met het juiste formaat.
# Reden uitschrijving: AN2; echte leveringen hebben ook codes zonder voorloopnul.
[domein.reden_uitschrijving]
patroon = '^[0-9]{1,2}$'

# Leerroute: AN3 (§15.5.4); lijst "Leerroute" niet in de beknopte PDF.
[domein.leerroute]
patroon = '^[0-9A-Z]{1,3}$'

# Locatiecode VSV: AN12..12 (§15.5.4).
[domein.locatiecode_vsv]
patroon = '^[0-9A-Z]{12}$'

# Onderwijslocatie: nnnXnnn (§15.5.4, RIO).
[domein.onderwijslocatie]
patroon = '^[0-9]{3}X[0-9]{3}$'

# BPV-omvang in uren: N1..4 in RO (§15.5.6), 10 N in GRONDSLAG (§17.5).
[domein.omvang_bpv_ro]
patroon = '^[0-9]{1,4}$'

[domein.omvang_bpv_grondslag]
patroon = '^[0-9]{1,10}$'

# LeerbedrijfID: 100000000 t/m 999999999 (§15.5.6).
[domein.leerbedrijf_id]
patroon = '^[1-9][0-9]{8}$'

# Postcodecijfers: N4, incl. 0010/0020/0030/0040 voor buitenland (§17.5).
[domein.postcodecijfers]
patroon = '^[0-9]{4}$'

[domein.datum_verplicht]
# Verplicht datumveld: mag niet leeg zijn (PvE §15.5.1 voor RO-VLP.DatumBeginPeriode, e.d.)
patroon = '^.+$'
ernst = "error"
verplicht = true

# Velden zonder domein (#288), per veldnaam over RO en GRONDSLAG: waarom er
# bewust geen domein is. tests/test_domeindekking.py eist voor elk veld een
# domein, een type (datum/getal: parseverlies) of een reden hier.
[geen_domein]
Burgerservicenummer = "persoonsidentifier; wordt gepseudonimiseerd en niet gepubliceerd, formaat (11-proef) niet gecontroleerd"
Onderwijsnummer = "persoonsidentifier; wordt gepseudonimiseerd en niet gepubliceerd, formaat (11-proef) niet gecontroleerd"
PseudoNummer = "persoonsidentifier (omgenummerd PGN); wordt gepseudonimiseerd"
Inschrijvingvolgnummer = "vrij volgnummer van de instelling (AN1..20); koppelsleutel, een verschuiving valt op als wees-feit"
Resultaatvolgnummer = "vrij volgnummer van de instelling (AN1..20); koppelsleutel, een verschuiving valt op als wees-feit"
ResultaatvolgnummerDiploma = "vrij volgnummer van de instelling (AN1..20); koppelsleutel, een verschuiving valt op als wees-feit"
Volgnummer = "vrij volgnummer van de instelling (AN1..20)"
CodeAMvBOnderdeel = "code uit een extern register; geen lijst in het PvE"
CodeGeneriekExamenonderdeel = "code uit een extern register; geen lijst in het PvE"
CodeKeuzedeel = "code uit het S-BB-register; geen lijst in het PvE"
VrijstellingGeneriekExamenonderdeel = "grond van vrijstelling (AN1..4); geen lijst in het PvE"
VrijstellingIE = "grond van vrijstelling (AN3); geen lijst in het PvE"
VrijstellingCE = "grond van vrijstelling (AN3); geen lijst in het PvE"
Verblijfstitel = "code uit de verblijfstiteltabel; niet in de beknopte PDF"
Nationaliteit1 = "code uit nationaliteitscode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
Nationaliteit2 = "code uit nationaliteitscode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
CodeGeboorteland = "code uit landcode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
CodeGeboortelandOuder1 = "code uit landcode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
CodeGeboortelandOuder2 = "code uit landcode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
CodeLandWaarnaarVertrokken = "code uit landcode.csv; een onbekende code blijft zichtbaar als niet gedecodeerd (enrich)"
DatumTijdBepalingBekostigingsgrondslagen = "tijdstempel (DT) van DUO; alleen provenance, niet gebruikt in het analysemodel"
